<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Imagens de compartilhamento (pré-visualização do link no WhatsApp, Instagram e Facebook), 1200x630.
     Com o site rodando localmente, abra /docs/og/og.html?p=home, produtos, consultoria ou imersao e tire um print de 1200x630.
     Salve em assets/og.png (home) ou assets/og-<página>.png e aumente o ?v= do og:image da página. -->
<link rel="stylesheet" href="../../assets/fontes/fontes.css">
<link rel="stylesheet" href="../../assets/mr.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(900px 520px at 88% 0%,rgba(214,221,210,.95),transparent 62%),radial-gradient(760px 460px at 0% 100%,rgba(226,207,211,.75),transparent 70%),#F3EEE4;color:#16302B;font-family:var(--f-body);position:relative}
.bg{position:absolute;right:-30px;bottom:-150px;font-family:var(--f-display);font-size:560px;line-height:1;letter-spacing:-.06em;color:rgba(22,48,43,.04)}
.in{position:absolute;inset:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.mark{font-size:2.2rem;background:#16302B;color:#F3EEE4}
h1{font-size:112px;line-height:.92;margin-top:28px}
h1 em{font-style:normal;color:#5B2B36}
.row{display:flex;align-items:center;gap:22px;font-size:28px;font-weight:600;color:#2D3835}
.pill{background:#16302B;color:#F3EEE4;border-radius:999px;padding:12px 26px;font-weight:700}
.eb{font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8A6B3D}
</style></head><body><div class="bg">MR</div><div class="in" id="c"></div>
<script>
var q=new URLSearchParams(location.search).get("p");
var R = '<span class="mark">MR</span>';
var P = {
  imersao: '<div>' + R + '<p class="eb" style="margin-top:34px">Imersão presencial · Nova Serrana, MG</p><h1>Gestão e<br><em>Liderança</em></h1></div><div class="row"><span class="pill">28 de novembro de 2026</span><span>Hotel Líber · 7h às 17h · 80 vagas</span></div>',
  produtos: '<div>' + R + '<p class="eb" style="margin-top:34px">Catálogo · Marcos Rodrigues</p><h1>Vende e<br><em>indica.</em></h1></div><div class="row"><span class="pill">Peça pelo site</span><span>O produto já vai escrito na mensagem</span></div>',
  consultoria: '<div>' + R + '<p class="eb" style="margin-top:34px">Consultoria para empresas</p><h1>Processos, pessoas<br><em>e resultado.</em></h1></div><div class="row"><span class="pill">Mais de 35 anos de empresa</span><span>Indústria e comércio · Nova Serrana, MG</span></div>',
  home: '<div>' + R + '<h1 style="margin-top:40px">Marcos<br><em>Rodrigues</em></h1></div><div class="row"><span class="pill">Vende e indica</span><span>Produtos e consultoria · Nova Serrana, MG</span></div>'
};
document.getElementById("c").innerHTML = P[q] || P.home;
</script></body></html>
